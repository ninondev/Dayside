<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>__MEANTIME_TITLE__</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --surface: #f5f5f7; --text: #1d1d1f; --text-2: #515154; --line: rgba(0,0,0,.12);
    --stroke: rgba(0,0,0,.45); --track: rgba(120,120,128,.18); --blue: #007aff; --dim: transparent;
    --action: #0071e3; --focus: #0071e3; --selection: rgba(0,113,227,.2);
    --serif: "New York", ui-serif, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --surface: #2c2c2e; --text: #f5f5f7; --text-2: #a1a1a6; --line: rgba(255,255,255,.14);
      --stroke: rgba(255,255,255,.5); --track: rgba(120,120,128,.32); --blue: #0a84ff; --dim: rgba(0,0,0,.22);
      --focus: #2997ff; --selection: rgba(41,151,255,.3); }
  }
  @media (prefers-contrast: more) { :root { --stroke: var(--text); --dim: transparent; } }
  :lang(zh-Hant) { --serif: "New York", ui-serif, "Songti TC", "Noto Serif CJK TC", "Source Han Serif TC", Georgia, serif; }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 34rem; padding: 1.25rem 1rem 3rem; color: var(--text); font: 1.0625rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--selection); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  p { margin: .375rem 0; text-wrap: pretty; }
  .muted { color: var(--text-2); font-size: .9375rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .mark svg { width: 1em; height: 1em; vertical-align: -.15em; margin-right: .35em; }
  .masthead { margin: 0 0 1.25rem; font-size: .9375rem; font-weight: 600; }
  .card-shown .masthead { display: none; }
  /* 明信片：上面一块是那边此刻的天（与 App 面板行同一种颜色与字），下面是那边今天的天与可约时段。 */
  .card { margin: 0 0 1.75rem; border: .75px solid var(--stroke); border-radius: 14px; overflow: hidden; }
  /* 上半像一行面板：左边名字与地名（衬线），右边大钟点与日期；底是那边此刻的天。 */
  .sky { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 1rem; row-gap: .2rem;
    min-height: 5.25rem; padding: 1.125rem 1.125rem 1rem; background: #f4f2ee; color: #111620; align-content: end; }
  .sky h1 { grid-column: 1; grid-row: 1; margin: 0; font: 500 1.625rem/1.15 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; }
  .sky .where { grid-column: 1; grid-row: 2; margin: 0; font: 400 1rem/1.3 var(--serif); overflow-wrap: anywhere; }
  .sky time { grid-column: 2; grid-row: 1; justify-self: end; font: 300 2.75rem/1 system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
  .sky .date { grid-column: 2; grid-row: 2; justify-self: end; margin: 0; font-size: .9375rem; white-space: nowrap; }
  .day { padding: .75rem 1.125rem 1rem; }
  .ruler { position: relative; height: 1.05rem; font-size: .6875rem; line-height: 1; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .ruler span { position: absolute; top: 0; transform: translateX(-50%); }
  .ruler span:first-child { transform: none; }
  .track { position: relative; }
  .lane { position: relative; height: 12px; border-radius: 3px; background: var(--surface); }
  .lane::before { content: ""; position: absolute; inset: 0; border-radius: 3px; background: var(--dim); }
  .lane::after { content: ""; position: absolute; inset: 0; border-radius: 3px; border: .75px solid var(--stroke); }
  .rail { position: relative; height: 4px; margin-top: 2px; border-radius: 2px; background: var(--track); }
  .rail span { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: var(--blue); }
  .now { position: absolute; top: -2px; bottom: -2px; width: 1.5px; margin-left: -.75px; background: var(--text); box-shadow: 0 0 0 1px var(--bg); }
  .day .foot { display: flex; align-items: flex-end; gap: .75rem; margin-top: .625rem; }
  .free { flex: 1; margin: 0; font-size: .875rem; color: var(--text-2); }
  .card .mark { margin: 0 0 0 auto; font-size: .75rem; color: var(--text-2); white-space: nowrap; }
  /* 你这边：此刻的钟点、日期、那边比你快慢多少。 */
  .yours { margin: 0 0 1.75rem; }
  .yours .label { margin: 0; font-size: .875rem; color: var(--text-2); }
  .yours .now-here { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; margin: .125rem 0 0; }
  .yours time { font: 300 1.75rem/1.2 system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
  .yours .zone { margin: .25rem 0 0; font-size: .8125rem; overflow-wrap: anywhere; }
  h2 { margin: 0 0 .5rem; font-size: 1.0625rem; line-height: 1.3; font-weight: 600; text-wrap: balance; }
  #snapshot, #window-status { font-variant-numeric: tabular-nums; }
  #window-status { font-weight: 500; }
  #window-status:empty { display: none; }
  ul { margin: .5rem 0 0; padding: 0; list-style: none; }
  /* 每个时段一行：左边你这边的时间与对方那边的时间，右边「选这个时段」。 */
  li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem; align-items: center; padding: .7rem 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  li p { grid-column: 1; margin: 0; }
  li .pick { grid-column: 2; grid-row: 1 / span 2; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { padding: .35rem .85rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--surface); cursor: pointer; }
  button.pick { font-size: .9375rem; }
  a.primary { display: inline-block; padding: .35rem .85rem; border-radius: .5rem; background: var(--action); color: #fff; text-decoration: none; }
  #booking { margin-top: 1.25rem; padding: 1rem 1.125rem 1.125rem; border: .75px solid var(--stroke); border-radius: 14px; }
  #booking h2 { margin-top: 0; }
  #booking label { display: block; margin: .625rem 0 .25rem; font-size: .9375rem; color: var(--text-2); }
  #booking select, #booking input, #booking textarea { width: 100%; box-sizing: border-box; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--bg); }
  #booking textarea { min-height: 3.5rem; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
  #booking-preview { white-space: pre-wrap; font-variant-numeric: tabular-nums; margin-top: .75rem; }
  [hidden] { display: none !important; }
  @media (max-width: 24rem) { .sky time { font-size: 2.375rem; } .sky h1 { font-size: 1.5rem; } }
  @media (max-width: 360px) {
    li { grid-template-columns: minmax(0, 1fr); row-gap: .375rem; }
    li .pick { grid-column: 1; grid-row: auto; justify-self: start; }
  }
</style>
</head>

      || typeof p.schedule.isWholeDay !== "boolean" || ![0,1].includes(p.schedule.endDayOffset)
      || !Array.isArray(p.schedule.workingWeekdays) || p.schedule.workingWeekdays.length < 1 || p.schedule.workingWeekdays.length > 7
      || p.schedule.workingWeekdays.some(d=>!Number.isInteger(d) || d<1 || d>7))) throw new Error("schedule");
    // 预约回执邮箱是可选的；不合形就当没有，不因此拒收整张名片。
    if (typeof p.contactEmail !== "string" || p.contactEmail.length > 254 || !/^[!-?A-~]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$/.test(p.contactEmail) || /[<>"\\,;()\[\]#\/]/.test(p.contactEmail)) delete p.contactEmail;
    // 坏的可选地名与坐标不影响名片其余内容。

    p.city = p.place ? cleanName(p.city) || undefined : undefined;
    if (p.city === p.place) delete p.city;
    if (!(Number.isFinite(p.latitude) && Number.isFinite(p.longitude) && Math.abs(p.latitude) <= 90 && Math.abs(p.longitude) <= 180)) { delete p.latitude; delete p.longitude; }
    else {

  }
  function render() {

    if (current && current === renderedFragment && resumeTick && !byID("content").hidden) { stop(); if (bookingCtx.picked && bookingCtx.relist) { bookingCtx.relist(); bookingCtx.refresh(); } resumeTick(); return; }
    renderedFragment = null; resumeTick = null;
    stop(); document.title = "Dayside"; byID("content").hidden = true; byID("status").hidden = false; document.body.className = "";
    text("heading",s.title); text("status",s.missing); byID("windows").replaceChildren(); byID("booking").hidden = true; bookingCtx.picked = null; clearCopyError();
    const fragment = location.hash.slice(1) || (embedded.startsWith("mt1.") ? embedded : "");
    if (!fragment) return;

      const sourceZone = p.fixedOffsetSeconds === undefined ? p.timeZoneID : "UTC";
      const sourceDate = date => new Date(date.getTime() + (p.fixedOffsetSeconds ?? 0)*1000);
      const theirs = format(sourceZone,{timeStyle:"short"});
      const yours = format(yourZone,{timeStyle:"short"});
      const theirDate = format(sourceZone,{weekday:"short",month:"short",day:"numeric"});
      const yourDate = format(yourZone,{weekday:"short",month:"short",day:"numeric"});
      const yourRange = format(yourZone,{dateStyle:"medium",timeStyle:"short"});
      const theirRange = format(sourceZone,{dateStyle:"medium",timeStyle:"short"});

      text("heading", p.displayName || p.place || s.title);
      document.title = [p.displayName, p.place].filter(Boolean).join(" · ") || "Dayside";

      text("their-zone", where); byID("their-zone").hidden = !where;
      text("your-zone", zoneLabel(yourZone, yourZone));
      byID("availability").hidden = !p.schedule; byID("no-availability").hidden = !!p.schedule;
      let freeLine = "";

        const wallTime = format("UTC",{timeStyle:"short"});
        const hours = p.schedule.isWholeDay ? s.allDay : p.schedule.endDayOffset === 1

        byID("lane").style.background = stops.length ? "linear-gradient(to right, " + stops.map((c, i) => c + " " + percent(i / (stops.length - 1))).join(", ") + ")" : "";
        const ruler = byID("ruler"); ruler.replaceChildren();
        const number = n => { try { return new Intl.NumberFormat(language).format(n); } catch { return String(n); } };

      };

        sky.style.background = now.gradient && !increased ? "linear-gradient(to bottom, " + now.top + ", " + now.horizon + ")" : now.mid;
        sky.style.color = now.ink ? hex(INK) : hex(PAPER);
      };
      // —— 无服务器预约 ——
      const bookingBox = byID("booking");
      text("booking-title", b.title); text("booking-start-label", b.start); text("booking-length-label", b.length);
      text("booking-name-label", b.name); text("booking-note-label", b.note); text("booking-ics", b.ics);
      text("booking-copy", b.copy); text("booking-close", b.close); text("booking-mail", b.mail);
      text("booking-no-email", b.noEmail);
      const startSelect = byID("booking-start"), lengthSelect = byID("booking-length");
      lengthSelect.replaceChildren(...[30, 45, 60, 90, 120].map(n => { const o = document.createElement("option"); o.value = n; o.textContent = n + " " + b.min; if (n === 60) o.selected = true; return o; }));
      const pad = n => String(n).padStart(2, "0");
      const stamp = d => d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
      // 固定偏移名片的 timeZoneID 本身就是「GMT+0545」这样的标签；换算用 UTC 算，标签照印它，别写成 UTC。
      const theirLabel = p.timeZoneID;
      // 起点只在「现在」与窗口终点之间取，且要装得下所选时长；时长一变就重列。
      const listStarts = () => {
        const w = bookingCtx.picked; if (!w) return [];
        const step = 30 * 60, length = Number(lengthSelect.value) * 60;
        const now = Math.floor(Date.now() / 1000);
        // 窗口自己的起点（按分钟取整）也算一个候选：09:17–09:52 这样的短窗口不该因为半点网格而一个起点都没有。
        const earliest = Math.ceil(Math.max(w.start, now) / 60) * 60;
        const options = [];
        if (earliest + length <= w.end) options.push(earliest);
        const first = Math.ceil(earliest / step) * step;
        for (let t = first; t + length <= w.end && options.length < 96; t += step) if (t !== earliest) options.push(t);
        return options;
      };
      const chosen = () => {
        const w = bookingCtx.picked; if (!w) return null;
        const start = new Date(Number(startSelect.value) * 1000);
        const end = new Date(start.getTime() + Number(lengthSelect.value) * 60000);
        if (!(start.getTime() / 1000 >= w.start && end.getTime() / 1000 <= w.end && start.getTime() >= Date.now() - 60000)) return null;
        return { start, end };
      };
      const requestText = (withoutNote = false, includeFooter = true) => {
        const c = chosen(); if (!c) return "";
        const who = byID("booking-name").value.trim(), note = withoutNote ? "" : byID("booking-note").value.trim();
        const lines = [(who ? who + colon : "") + b.intro,
          b.mine + colon + yourRange.formatRange(c.start, c.end) + " (" + yourZone + ")",
          b.theirs + colon + theirRange.formatRange(sourceDate(c.start), sourceDate(c.end)) + " (" + theirLabel + ")",
          "UTC" + colon + c.start.toISOString().slice(0, 16).replace("T", " ") + " – " + c.end.toISOString().slice(0, 16).replace("T", " ")];
        if (note) lines.push("", note);
        if (includeFooter) lines.push("", b.footer);
        return lines.join("\n");
      };
      const previewText = c => {
        const lines = [s.yours + colon + yourRange.formatRange(c.start, c.end) + " (" + yourZone + ")",
          s.original + colon + theirRange.formatRange(sourceDate(c.start), sourceDate(c.end)) + " (" + theirLabel + ")"];
        const note = byID("booking-note").value.trim();
        if (note) lines.push("", note);
        return lines.join("\n");
      };
      const relistStarts = () => {
        const keep = startSelect.value;
        const options = listStarts();
        startSelect.replaceChildren(...options.map(t => { const o = document.createElement("option"); o.value = t; o.textContent = yourRange.format(new Date(t * 1000)); return o; }));
        if (options.some(t => String(t) === keep)) startSelect.value = keep;
        return options.length;
      };
      const refreshBooking = () => {
        const c = chosen();
        const buttons = ["booking-ics", "booking-copy"];
        mailNote.hidden = true; mailNote.textContent = "";

          clearCopyError();
          const now = Date.now() / 1000;
          text("booking-preview", now >= p.validUntil ? s.expired : bookingCtx.picked && bookingCtx.picked.end > now ? b.slotTooShort : s.empty);
          byID("booking-mail").hidden = true; byID("booking-no-email").hidden = true;

        if (!manualCopy.hidden) manualCopy.value = requestText();

          const who = byID("booking-name").value.trim();

          // mailto 整条按 2,000 字节以内设计（Outlook 桌面版约 2,083 上限）：超了就把备注拿掉、提示用复制。
          let href = "mailto:" + encodeURIComponent(p.contactEmail) + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(requestText());
          if (href.length > 2000) {
            href = "mailto:" + encodeURIComponent(p.contactEmail) + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(requestText(true) + "\n\n" + b.long);
            mailNote.textContent = b.long; mailNote.hidden = false;
          }
          mail.href = href;
          mail.hidden = false; byID("booking-no-email").hidden = true;
        } else { mail.hidden = true; byID("booking-no-email").hidden = false; }
      };
      const utf8 = new TextEncoder();
      const foldLine = line => {
        const out = []; let current = "", budget = 75;
        for (const ch of line) {
          const size = utf8.encode(ch).length;
          if (utf8.encode(current).length + size > budget) { out.push(current); current = " "; budget = 75; }
          current += ch;
        }
        out.push(current);
        return out;
      };
      const makeICS = () => {
        const c = chosen(); if (!c) return;
        const esc = v => String(v).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
        const summary = b.subject + (p.displayName ? " · " + p.displayName : "");
        // 没有 METHOD：RFC 5546 要求 METHOD:PUBLISH 的 VEVENT 带 ORGANIZER，这里没有组织者；纯 VCALENDAR 各家日历都收。
        // 每行按 RFC 5545 §3.1 折到 75 字节以内（按 UTF-8 字节数，不拆开多字节字符），续行以一个空格开头。

          "UID:" + stamp(c.start) + "-" + Math.random().toString(36).slice(2, 10) + "@dayside", "DTSTAMP:" + stamp(new Date()),
          "DTSTART:" + stamp(c.start), "DTEND:" + stamp(c.end), "SUMMARY:" + esc(summary), "DESCRIPTION:" + esc(requestText()),
          "END:VEVENT", "END:VCALENDAR"].flatMap(foldLine).concat([""]).join("\r\n");

        setTimeout(() => URL.revokeObjectURL(url), 10000);
      };
      function openBooking(w) {
        // 装不下当前时长也照样打开：起点为空时提示缩短时长，改短后恢复。

          paintSky(instant);

          text("offset", difference ? placeLabel + " " + fill(difference > 0 ? s.ahead : s.behind, { d: duration(Math.abs(difference)) }) : "");

        if (p.schedule && minute !== lastListed) {

})();
