[package]
name = "dayside_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
intents-only = []
parser-table-generator = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision", "raw_value"] }
libc = "0.2"
memmap2 = "0.9"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-general-category = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# App 的 Debug 构建保留调试信息，并优化热路径。
[profile.app-debug]
inherits = "dev"
opt-level = 3
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
